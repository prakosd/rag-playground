[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-playground"
version = "0.1.0"
description = "RAG playground: crawl websites to Markdown (crawl4md), build vector indexes (vector_indexer), answer questions over them (rag_engine), and shared artifact utilities (artifact_store)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rag-playground contributors" }]
keywords = ["crawling", "markdown", "extraction", "web-scraping", "rag", "embeddings", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# The base install carries no third-party dependencies: the artifact_store
# library is pure standard library. Every other library is an opt-in extra so
# installs stay lightweight and pull only what a component actually uses.
dependencies = []

[project.optional-dependencies]
# crawl4md — crawl websites and extract Markdown (Step 1).
crawl = [
    "crawl4ai>=0.8.6",
    # Capped below 2.1: trafilatura 2.1.0 (lxml bump) + 2.2.0 (extraction revamp)
    # regressed inline <ref>→Markdown links with output_format="markdown"
    # (include_links=True) — href dropped, anchor text kept — which the extractor
    # relies on. Still broken on 2.2.0 (2026-09). See docs/DEVELOPMENT.md
    # "Dependency pins" for the re-verify recipe before raising the cap.
    "trafilatura>=1.6.0,<2.1",
    "markdownify>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "mdformat>=0.7.19",
    "mdformat-gfm>=0.3.6",
    "httpx>=0.27.0",
    "truststore>=0.9",
    "pydantic>=2.0",
    "pymupdf4llm>=0.0.17",
    "mammoth>=1.6.0",
]
# vector_indexer — chunk + embed + store (Step 2). Local offline embeddings
# work with just this extra; cloud backends below are additional opt-ins.
# chromadb is imported directly and pinned below its next major (the offline
# ONNX embedder lives there too); langchain-chroma wraps it. The major cap is
# insurance against an untested change to chromadb's Rust-backend client init.
vector = [
    "langchain-chroma>=1.0,<2.0",
    "chromadb>=1.0,<2.0",
    "langchain-text-splitters>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.0",
]
# Optional cloud backends. Each provider is a LangChain integration package that
# carries its own SDK (langchain-aws pulls boto3, langchain-openai pulls openai)
# and serves both embeddings (Step 2) and chat models (Steps 4-5).
bedrock = ["langchain-aws>=1.0"]    # Amazon Titan embeddings + Bedrock chat.
openai = ["langchain-openai>=1.0"]  # OpenAI embeddings + chat.
# rag_engine — retrieval + QA + conversational RAG (Steps 3-5). The langchain
# umbrella provides init_chat_model for unified provider switching.
rag = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "pydantic>=2.0",
]
# rag_engine cross-encoder re-ranking for conversational RAG (Step 5). Heavy: it
# pulls torch via sentence-transformers. The "llm" and "off" re-rankers need it
# not, and CONV_RAG_RERANKER can disable local re-ranking where it is unwanted.
rerank = ["sentence-transformers>=3.0"]
# Convenience meta-extra: every library and backend (no dev tools).
all = ["rag-playground[crawl,vector,bedrock,openai,rag,rerank]"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
# Vendored agent-skill templates are managed by skills-lock.json, not linted here.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short"
filterwarnings = [
    "ignore:Tesseract OCR is not installed:UserWarning",
]
