# Language-model pricing & display metadata for the RAG model picker.
#
# Prices are USD per 1,000,000 tokens (on-demand) for the region below. This file
# is display/cost metadata only — the CALLABLE model list lives in
# src/rag_engine/catalog.py; keep each `model_id` here in sync with a catalog id.
# Models with no published price (price_* omitted) show "—" for cost.
#
# size_band follows the pricing source's bands: XS, Small, Medium, Large, XL,
# Frontier. The picker offers only the bands allowed by RAG_LLM_SIZE_BANDS.

pricing_captured: "2026-08-19"
region: ap-southeast-2
sources:
  - name: Amazon Bedrock Pricing
    url: https://aws.amazon.com/bedrock/pricing/
  - name: AWS Bedrock Explorer (ap-southeast-2)
    url: https://aws-bedrock-explorer.com/regions/ap-southeast-2
  - name: OpenAI API Pricing
    url: https://developers.openai.com/api/docs/pricing

